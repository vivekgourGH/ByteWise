name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build backend (skip tests)
        run: mvn -f backend/pom.xml -B -DskipTests package

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: |
          cd cab
          npm ci

      - name: Lint frontend
        run: |
          cd cab
          npm run lint --if-present

      - name: Build frontend
        run: |
          cd cab
          npm run build
